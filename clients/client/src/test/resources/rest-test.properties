# Default local smoke-test configuration for a SW360 Keycloak-backed setup.
# Override these via system properties (-Drest_base_url=...) or environment variables.
rest_base_url=http://localhost:8080/resource/api
oauth_base_url=http://localhost:8083/realms/sw360/protocol/openid-connect/token
# Alternative to oauth_base_url: set the Keycloak realm issuer URL and the
# token endpoint will be derived automatically (issuer + /protocol/openid-connect/token).
# oauth_issuer=http://localhost:8083/realms/sw360
# Authentication uses the OAuth2 client-credentials grant.
oauth_client_id=trusted-sw360-client
oauth_client_secret=
